name: Missed pattern (false negative)
description: A spoken form or stiff phrase the tool does not flag
labels: [enhancement]
body:
  - type: textarea
    id: phrase
    attributes: {label: The phrase and its context (invented or public)}
    validations: {required: true}
  - type: textarea
    id: why
    attributes: {label: Why it reads spoken or template-like, and what a careful author would write or ask}
    validations: {required: true}
  - type: dropdown
    id: unambiguous
    attributes:
      label: Is there exactly one right replacement in thesis prose?
      options: ["Yes (could be high)", "Probably (medium)", "No, it needs the author (a question)"]
    validations: {required: true}
